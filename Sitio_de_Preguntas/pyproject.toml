[project]
name = "sitio-de-preguntas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Agus-Pax", email = "pazagus2018@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=27.0.1",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
sitio-de-preguntas = "sitio_de_preguntas:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
